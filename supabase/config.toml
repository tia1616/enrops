# Supabase project config — primarily codifies per-function verify_jwt so
# deploys can't silently flip a webhook to require-JWT (which breaks Stripe/
# Checkr) or expose an authed endpoint. Values mirror PROD's live settings
# (verified 2026-06-08).
#
# "FUNCTIONS NOT LISTED DEFAULT TO verify_jwt = true" WAS TRUE AND IS NOT A
# SAFETY NET, which cost a real incident on 2026-08-13 (staging only, caught and
# reverted the same minute). The default applies when a function is FIRST
# created. On a redeploy the CLI simply omits the field for any function it has
# no config entry for, and the API keeps whatever the last deploy set — so a
# single `--no-verify-jwt` deploy turns verification off PERMANENTLY, and
# redeploying "correctly" without the flag does not put it back. Five authed
# onboarding endpoints sat with the gateway wide open until they were pinned
# here explicitly.
#
# Hence the section below: anything that must REQUIRE a JWT is now stated, not
# assumed. If you add an authed function, list it. The one-line check that this
# file is telling the truth is a request with no Authorization header — the
# gateway answers `UNAUTHORIZED_NO_AUTH_HEADER` when verification is on, and the
# function's own error when it is off.
project_id = "enrops"

# ── verify_jwt = true (authed endpoints, pinned rather than assumed) ──
# These take a signed-in user's JWT. Each also does its own auth check, which is
# why the outage above was not a data breach — but that check is defence in
# depth, not the gate, and it must not be the only thing standing there.
[functions.update-onboarding-step]
verify_jwt = true

[functions.reconcile-onboarding-gate]
verify_jwt = true

[functions.submit-training]
verify_jwt = true

[functions.admin-upload-background-check]
verify_jwt = true

[functions.refresh-stripe-status]
verify_jwt = true

# ── verify_jwt = false (public / webhook / cron entrypoints) ──
[functions.stripe-webhook]
verify_jwt = false

[functions.stripe-oauth-callback]
# MUST stay false. This is the redirect target Stripe sends the operator's
# BROWSER to after they pick an account; it carries no Supabase JWT and never
# can. Its security comes from the single-use row in stripe_oauth_states, not
# from auth. Deploying it with verify_jwt = true would make every connect
# attempt 401 after the operator had already authorised at Stripe.
# (stripe-oauth-start and stripe-oauth-disconnect are NOT listed: both take an
# operator's JWT and default to verify_jwt = true, which is what they need.
# stripe-oauth-disconnect in particular must NEVER be public - it detaches the
# account a business gets paid through.)
verify_jwt = false

[functions.org-fee-config]
verify_jwt = false

[functions.checkout-session-status]
verify_jwt = false

[functions.create-registration]
verify_jwt = false

[functions.sync-operator-stripe-status]
# CORRECTED 2026-07-28. The note below claimed PROD had this as verify_jwt =
# false. It does not: prod is TRUE, staging is false, and the two have drifted.
# Deploying from this file as written would have silently LOOSENED auth on prod,
# which is the exact failure the deploy-edge-fn skill exists to prevent. True is
# both correct and stricter, and the function works under it on prod today: the
# only caller (Finances.jsx "Check status") always sends a real user JWT.
#
# RESOLVED 2026-07-29. The drift is GONE - `functions list` now reports
# verify_jwt=true on BOTH staging and prod, so this file matches reality on both
# and a plain deploy (no --no-verify-jwt) is correct. The line above saying
# "staging is the anomaly and should be tightened" is kept only for history; do
# not act on it, it describes a state that no longer exists.
#
# Superseded note, kept so the mistake is legible: it read
# "Mirrors PROD, which has this as verify_jwt = false. The function does its own
# auth: it reads the caller's Bearer token and checks org membership, and the
# only caller (Finances.jsx "Check status") always sends a real user JWT. Listed
# here because it was previously assumed to be prod-only and absent from the
# repo — it is not, and a deploy without --no-verify-jwt silently tightens it."
verify_jwt = true

[functions.process-installments]
verify_jwt = false

[functions.auth-send-magic-link]
verify_jwt = false

[functions.regenerate-email-logo]
verify_jwt = false

[functions.marketing-unsubscribe]
verify_jwt = false

[functions.checkr-webhook]
verify_jwt = false

[functions.session-confirmation-cron]
verify_jwt = false

[functions.contractor-onboarding-reminders]
verify_jwt = false

[functions.resend-onboarding-invite]
verify_jwt = false

[functions.stripe-connect-instructor-webhook]
verify_jwt = false

[functions.apps-script-roster-sync]
verify_jwt = false

[functions.marketing-touchpoint-send]
verify_jwt = false

# Deployed with verify_jwt = false on BOTH environments, but that was never
# recorded here - it survived only because the CLI preserves the current value
# when the flag is omitted. Pinning it 2026-08-10 so a future deploy cannot
# silently flip it to the true default.
#
# false is correct, not a gap: the function authenticates callers itself and
# more strictly than the platform gate would. verifyCaller rejects a missing or
# invalid session with 401, and a caller who is not an admin of the target
# organization with 403. The platform gate only proves a JWT is valid, which
# would let any signed-in user reach another org's campaign drafting.
[functions.marketing-draft-campaign]
verify_jwt = false

[functions.lifecycle-automations-cron]
verify_jwt = false

# Daily push alert to operators about lifecycle emails that didn't reach a family.
# Cron-invoked (pg_cron net.http_post with the anon bearer), so no JWT required.
[functions.delivery-alert-cron]
verify_jwt = false

[functions.marketing-resend-webhook]
verify_jwt = false

# Weekly platform-intelligence digest cron entrypoint — authenticates callers
# itself against the replay_digest_cron_secret gate (see
# 20260702_platform_intel_digest_infra.sql), so it must NOT require a JWT.
[functions.platform-intelligence-digest]
verify_jwt = false

# Note: prod also has admin-convert-logo and
# dev-seed-designer-access as verify_jwt=false, but those are NOT in this
# repo (prod-only / legacy), so they're intentionally omitted here.


# Founder milestone notifications. Called by pg_net straight from a DB trigger
# (see 20260728c_founder_notifications.sql), so there is no user JWT to present;
# it authenticates the caller itself against the founder_notify_secret gate.
[functions.founder-notify]
verify_jwt = false

# Day 1 welcome letter to a new provider. Called by pg_net from a DB trigger when
# onboarding completes, so there is no user JWT; it checks operator_welcome_secret itself.
[functions.operator-welcome]
verify_jwt = false
